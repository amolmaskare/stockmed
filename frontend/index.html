<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="index.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>

<body>
 
  <div id="navbar-placeholder"></div>

  <script>
      fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
              document.getElementById("navbar-placeholder").innerHTML = data;
          })
          .catch(error => console.error("Error loading navbar:", error));
  </script>
  

       <div class="hero-section">
            <video autoplay loop muted playsinline>
              <source src="/frontend/Home_video_stockmed.mp4" type="video/mp4">
               Your browser does not support the video tag.
            </video>
            <div class="container">
                <h1>Your Pharmacy,</h1>
                <h2>Just a Click Away!</h2>
            </div>
       </div>    
  
      <!-- End main image -->

      <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      // Fetch username from PHP session
      fetch('../backend/get_user.php')
        .then(response => response.json())
        .then(data => {
          if (data.username) {
            const userInitial = data.username.charAt(0).toUpperCase(); // Get first letter
            localStorage.setItem('userInitial', userInitial); // Store in localStorage
            document.getElementById('user-initial').textContent = userInitial;
          }
        })
        .catch(error => console.error('Error fetching user:', error));
    </script>
    
</body> 
</html>
