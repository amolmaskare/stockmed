<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - StockMed</title>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>
  <script>
    // Fetch and Insert Navbar
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar-placeholder").innerHTML = data;
            // Call function to set active navbar link
            setActiveNavLink();
        })
        .catch(error => console.error("Error loading navbar:", error));

    // Function to Highlight Active Link
    function setActiveNavLink() {
        const currentPage = window.location.pathname.split("/").pop();
        const navLinks = document.querySelectorAll(".nav-link");

        navLinks.forEach(link => {
            if (link.getAttribute("href") === currentPage) {
                link.classList.add("active");
            } else {
                link.classList.remove("active");
            }
        });
    }
</script>
  <!-- Contact Us Section -->
  <div class="contact-container">
    <div class="contact-header">
      <h2>Contact Us</h2>
      <p>We're here to help! Reach out to us for any questions or feedback.</p>
    </div>
    <form id="contact-form" action="submit_contact.php" method="POST">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <input id="message" name="message" rows="4" required></input>
      </div>
      <button type="submit" class="popup-button">
        <span>Submit</span>
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </div>

  <!-- Floating Icons for Decoration -->
  <div class="floating-icons">
    <div class="icon"><i class="fas fa-comment-dots"></i></div>
    <div class="icon"><i class="fas fa-envelope"></i></div>
    <div class="icon"><i class="fas fa-headset"></i></div>
  </div>
<!-- Include cart.js -->
<script src="./js/cart.js"></script>
  <!-- Scripts -->
  
</body>
</html>
