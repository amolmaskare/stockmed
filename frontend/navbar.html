<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand me-auto" href="index.html">StockMeds</a>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">StockMeds</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-center flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="aboutus.html">About Us</a>

                        <li class="nav-item">

                        <li class="nav-item">
                            <a class="nav-link mx-lg-2" href="contact.html">Contact Us</a>
                        </li>
                    </ul>

                    <!-- Search Form -->
                    <form class="d-flex search-form" role="search" action="order.php" method="GET" onsubmit="return validateSearch()">
                        <input class="form-control me-2" type="search" name="query" placeholder="Search" aria-label="Search" id="searchInput">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>

            <!-- User and Cart Container -->
            <div id="user-cart-container">
                <a href="login.html" id="login-button">Login</a>
                <div id="cart-container">
                    <span id="cart-count">0</span>
                    <img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png" id="cart-icon" alt="Cart Icon">
                </div>
            </div>

            <button class="navbar-toggler pe-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <script>
        // Function to Validate Search Input
        function validateSearch() {
            const searchInput = document.getElementById('searchInput').value.trim();
            if (searchInput === "") {
                alert("Please enter a search term.");
                return false;
            }
            return true;
        }

        // Function to Highlight Active Link
        function setActiveNavLink() {
            const currentPage = window.location.pathname.split("/").pop(); 
            const navLinks = document.querySelectorAll(".nav-link");

            navLinks.forEach(link => {
                if (link.getAttribute("href") === currentPage) {
                    link.classList.add("active");
                } else {
                    link.classList.remove("active");
                }
            });
        }

        // Run the function after navbar is loaded
        document.addEventListener("DOMContentLoaded", setActiveNavLink);
    </script>
</body>
</html>
